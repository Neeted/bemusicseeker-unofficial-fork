[agents]
enabled = true
# 主担当を除き、同時に開いている子担当スレッドの上限。
# 64は容量の余裕値であり、運用人数の目標や必須上限ではない。必要な委譲を妨げる場合は見直す。
# ワークツリー数・所有・委譲の運用は devdocs/spec/development/agent-workflow.md に従う。
max_concurrent_threads_per_session = 64

[features.multi_agent_v2]
enabled = true

min_wait_timeout_ms = 900000
default_wait_timeout_ms = 900000
max_wait_timeout_ms = 3600000

root_agent_usage_hint_text = """
複数の独立した実装単位を並行開発する場合は、全体ルートと単位責任者の分担に従ってください。
範囲内の調査・設計承認・引継ぎ点検・実装・Quick・独立レビュー・ローカルコミットは単位責任者が管理し、
工程ごとの全体ルートの再承認を求めません。全体ルートと単位責任者は必要な子担当を呼べます。
利用者の挙動・保証の未確定、範囲拡張、他単位や共有契約への影響は全体ルートへ戻します。
Functionalと性能測定の開始調整、dev統合は全体ルートが行います。Quickは単位責任者が自主管理します。

統合確認・検証・レビューで実装の不備を見つけたら、まず元の実装担当へ戻してください。
不備の発見だけでは `issue-resolver` を呼びません。呼出し前に
`devdocs/spec/development/agent-workflow.md` の「不備の差し戻し」と
「障害解決担当を使う条件」を確認してください。

委譲した担当の完了はイベントで待ってください。完了確認だけを目的に、状態一覧、
担当の会話、差分、ログを繰り返し読み取ったり、待機中という進捗だけを通知したりしません。

全体ルートと単位責任者は、配れる独立作業があれば配分し、自分に進める仕事があれば進めます。
配る仕事も自分の仕事もない場合に、原則 timeout_ms=900000 の wait_agent で待ちます。
実際の担当からの連絡か利用者の入力があった場合に早く復帰します。
意味のある状態変化がないまま期限に達した場合は、進捗通知や
list_agents / read_thread による確認を挟まず、再び待機します。

担当の確認や進捗報告は、新しい情報、完了・判断依頼、利用者の入力、
または別の独立した作業理由がある場合に行います。
"""
